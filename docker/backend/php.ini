expose_php = Off
memory_limit = 256M
upload_max_filesize = 2M
post_max_size = 4M
date.timezone = UTC

; Defensa en profundidad ante CVE-2026-109619: la API no usa el progreso de subida nativo de PHP.
session.upload_progress.enabled = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
