# Infraestructura local de desarrollo (PostgreSQL + Redis).
# Las credenciales se leen del .env de este directorio; los puertos solo
# escuchan en 127.0.0.1 para no exponer servicios en la red local.
services:
    pgsql:
        image: 'postgres:17-alpine'
        restart: unless-stopped
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
            TZ: 'UTC'
            PGTZ: 'UTC'
        volumes:
            - 'kds-pgsql:/var/lib/postgresql/data'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql:ro'
        healthcheck:
            test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE}', '-U', '${DB_USERNAME}']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: 'redis:7-alpine'
        restart: unless-stopped
        command: ['redis-server', '--appendonly', 'yes']
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'kds-redis:/data'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    kds-pgsql:
    kds-redis:
